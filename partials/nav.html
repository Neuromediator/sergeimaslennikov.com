<header class="top">
  <a class="brand" href="{{home_href}}">{{brand}}</a>
  <nav class="nav-links" aria-label="{{labels.sections}}">
    {{#nav}}<a href="{{href}}">{{short}}</a>
    {{/nav}}
  </nav>
  <div class="top-actions">
    <button type="button" class="menu-btn" aria-expanded="false" aria-controls="menu"><span class="when-closed">{{labels.menu}}</span><span class="when-open">{{labels.close}}</span></button>
    {{#langs}}<div class="lang" role="group" aria-label="{{labels.language}}">
      {{#items}}<a href="{{href}}" hreflang="{{code}}" lang="{{code}}"{{&current}}>{{short}}</a>
      {{/items}}
    </div>
    {{/langs}}
    <button type="button" class="theme-btn" aria-label="{{labels.theme}}" title="{{labels.theme}}"><span></span></button>
  </div>
</header>
<div class="menu" id="menu">
  <nav class="menu-links" aria-label="{{labels.sections}}">
    {{#nav}}<a href="{{href}}"><span class="num">{{num}}</span><span class="name">{{label}}</span></a>
    {{/nav}}
  </nav>
  <div class="menu-settings">
    {{#langs}}<div class="menu-row">
      <span>{{labels.language}}</span>
      <span class="lang">
        {{#items}}<a href="{{href}}" hreflang="{{code}}" lang="{{code}}"{{&current}}>{{short}}</a>
        {{/items}}
      </span>
    </div>
    {{/langs}}
    <div class="menu-row menu-theme">
      <span>{{labels.theme}}</span>
      <span class="pick">
        <button type="button" data-theme-set="dark">{{labels.dark}}</button>
        <button type="button" data-theme-set="light">{{labels.light}}</button>
      </span>
    </div>
  </div>
</div>
<script>
(function () {
  var root = document.documentElement;
  // dark is the default; only an explicit choice makes it light
  function effective() {
    return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  }
  function setTheme(next) {
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('site-theme', next); } catch (e) {}
  }
  var toggle = document.querySelector('.theme-btn');
  if (toggle) toggle.addEventListener('click', function () {
    setTheme(effective() === 'dark' ? 'light' : 'dark');
  });
  [].forEach.call(document.querySelectorAll('[data-theme-set]'), function (b) {
    b.addEventListener('click', function () { setTheme(b.getAttribute('data-theme-set')); });
  });

  // the phone menu
  var btn = document.querySelector('.menu-btn');
  var menu = document.getElementById('menu');
  if (!btn || !menu) return;
  function setOpen(open) {
    root.classList.toggle('menu-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  btn.addEventListener('click', function () { setOpen(!root.classList.contains('menu-open')); });
  menu.addEventListener('click', function (e) {
    if (e.target.closest('a')) setOpen(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setOpen(false);
  });
})();
</script>
